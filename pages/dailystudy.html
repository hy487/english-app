<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>DailyStudy | English App</title>
</head>

<body>
    <div class="nav-bar">
        <div class="burger" id="burger">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="center">
            <a href="../index.html">Dashboard</a>
            <a href="mydictionary.html">MyDictionary</a>
            <a href="addwords.html">AddWords</a>
            <a style="color: black; border-bottom: var(--green) solid 2px;
">DailyStudy</a>
            <a href="dailyreview.html">DailyReview</a>
        </div>
        <div class="user" id="profileBtn">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>
    <dialog id="profileMenu" class="dropdown-menu" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <a>Logout</a>
    </dialog>

    <dialog id="mobileSidebar" class="sidebar-dialog">
    <div class="sidebar-content">
        <div class="sidebar-header">
            <h3 class="sidebar-title">Menu Navigations</h3>
            <button id="closeSidebarBtn" class="sidebar-close-icon">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <hr class="form-divider" style="margin-top: 10px; margin-bottom: 20px;">
        <div class="sidebar-links-stack">
            <a href="../index.html"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="mydictionary.html"><i class="fa-solid fa-book"></i> MyDictionary</a>
            <a href="addwords.html"><i class="fa-solid fa-plus"></i> AddWords</a>
            <a href="dailystudy.html"><i class="fa-solid fa-graduation-cap"></i> DailyStudy</a>
            <a href="dailyreview.html"><i class="fa-solid fa-clock-rotate-left"></i> DailyReview</a>
        </div>
    </div>
</dialog>
    <!-- navbar done -->

<div class="add-word-page-container">
        
        <div class="form-card" id="quizCard">
            <div class="form-card-header" style="justify-content: space-between; width: 100%;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="header-icon-box" style="background-color: #e1faf3;">
                        <i class="fa-solid fa-graduation-cap" style="color: #00e59b; background-color: #e1faf3;"></i>
                    </div>
                    <h2 class="form-card-title" id="quizTitle">Learn new words</h2>
                </div>
                <span id="quizProgress" style="font-family: 'Quicksand', sans-serif; font-weight: 700; color: #64748b; font-size: 14px;">Question 0/0</span>
            </div>
            
            <hr class="form-divider">

            <div id="questionArea">
                <p style="text-align: center; color: #64748b; padding: 20px;">Generating your daily review session...</p>
            </div>
        </div>

        <div class="form-button-actions-row" id="actionRow">
            <button type="button" class="form-submit-btn disabled" id="quizActionBtn" disabled>
                Submit Answer <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/affb4f2811.js" crossorigin="anonymous"></script>
    <script src="dailystudy.js"></script>
    

</body>
